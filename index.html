<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Downloader</title>
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .card { width: 90%; max-width: 400px; background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ec4899; }
        input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 10px; border: none; outline: none; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #8b5cf6; color: white; font-weight: bold; cursor: pointer; }
        #status { margin-top: 20px; color: #cbd5e1; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>V-DOWN</h2>
        <input type="text" id="url" placeholder="Paste link here...">
        <button onclick="download()">Download Video</button>
        <div id="status">Ready</div>
    </div>

    <script>
        async function download() {
            const val = document.getElementById('url').value;
            const st = document.getElementById('status');
            if(!val) return alert("Paste a link!");
            
            st.innerText = "⏳ Fetching...";
            try {
                const res = await fetch(`https://api.vkrdown.com/server?v=${encodeURIComponent(val)}`);
                const data = await res.json();
                if(data.data && data.data.url) {
                    st.innerHTML = `<a href="${data.data.url[0].url}" target="_blank" style="color:#10b981; text-decoration:none; font-weight:bold;">✅ CLICK HERE TO SAVE</a>`;
                } else {
                    st.innerText = "❌ Not found";
                }
            } catch(e) {
                st.innerText = "❌ Error. Try again.";
            }
        }
    </script>
</body>
</html>
