<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>All-In-One Video Downloader</title>
  
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #ec4899;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
    
    .container { 
      width: 100%; 
      max-width: 450px; 
      background: var(--card); 
      border-radius: 30px; 
      padding: 30px; 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255,255,255,0.05);
    }

    h2 { text-align: center; font-size: 1.6rem; font-weight: 800; background: linear-gradient(to right, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-top: 0; margin-bottom: 25px; }
    
    .input-wrapper {
      background: #334155;
      border-radius: 16px;
      padding: 5px;
      display: flex;
      align-items: center;
      border: 2px solid transparent;
      transition: 0.3s;
    }
    .input-wrapper:focus-within { border-color: var(--primary); }

    input { 
      flex: 1; 
      background: transparent; 
      border: none; 
      padding: 15px; 
      font-size: 1rem; 
      color: white; 
      outline: none; 
    }
    input::placeholder { color: #64748b; }

    .btn-download { 
      width: 100%; 
      border: none; 
      padding: 16px; 
      border-radius: 16px; 
      font-weight: 800; 
      font-size: 1.1rem; 
      cursor: pointer; 
      color: white; 
      margin-top: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      transition: 0.3s;
    }
    .btn-download:active { transform: scale(0.98); }

    .status { 
      margin-top: 20px; 
      padding: 15px; 
      background: #334155; 
      border-radius: 16px; 
      font-size: 0.95rem; 
      min-height: 50px; 
      color: #cbd5e1; 
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .supported-platforms {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
      color: #64748b;
      font-size: 0.8rem;
    }
    .platform { background: #334155; padding: 5px 10px; border-radius: 8px; color: #cbd5e1; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>V-DOWN DOWNLOADER</h2>
  <p class="subtitle">Download social media videos instantly!</p>
  
  <div class="input-wrapper">
    <input type="text" id="videoUrl" placeholder="Paste video link here...">
  </div>

  <button id="downloadBtn" class="btn-download">Download Video</button>

  <div class="status" id="statusMsg">Paste a link above to begin.</div>

  <div class="supported-platforms">
    <span class="platform">TikTok</span>
    <span class="platform">Instagram</span>
    <span class="platform">Facebook</span>
  </div>
</div>

<script>
  const downloadBtn = document.getElementById('downloadBtn');
  const videoUrl = document.getElementById('videoUrl');
  const statusMsg = document.getElementById('statusMsg');

  // 💰 ADSTERRA CONFIGURATION
  // Put your Adsterra Direct Link inside the quotes below!
  const ADSTERRA_DIRECT_LINK = "https://your_direct_link_here.com";

  async function handleDownload() {
    const url = videoUrl.value.trim();
    
    if (!url) {
      statusMsg.innerText = "⚠️ Please paste a valid link first!";
      return;
    }

    statusMsg.innerText = "⏳ Processing video... Please wait.";

    // 🚀 STEP 1: OPEN THE ADSTERRA DIRECT LINK (MONETIZATION)
    // This will force the ad to open in a new tab immediately!
    window.open(ADSTERRA_DIRECT_LINK, '_blank');

    // 🛠️ STEP 2: FETCH THE VIDEO USING A FREE API
    // We are using a public free API to grab TikTok videos as an example
    try {
      // Free public TikTok API endpoint
      const apiUrl = `https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(url)}`;
      
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data && data.video && data.video.noWatermark) {
        statusMsg.innerHTML = `<span style="color:#10b981;">✔️ Video Ready!</span><br><br><a href="${data.video.noWatermark}" target="_blank" style="color: #60a5fa; font-weight:bold;">👉 Click Here to Save File 👈</a>`;
      } else {
        statusMsg.innerText = "⚠️ Could not grab video. Is the link correct?";
      }

    } catch (error) {
      statusMsg.innerText = "❌ Network error. Try again later.";
      console.error(error);
    }
  }

  downloadBtn.onclick = handleDownload;
</script>

</body>
</html>
