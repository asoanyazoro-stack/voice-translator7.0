<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>V-Downloader Pro</title>
  
  <style>
    :root { --primary: #8b5cf6; --secondary: #ec4899; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
    
    .container { width: 100%; max-width: 450px; background: var(--card); border-radius: 30px; padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); text-align: center; }
    h2 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(to right, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px; }
    
    input { width: 100%; background: #334155; border: 2px solid transparent; border-radius: 16px; padding: 18px; color: white; font-size: 1rem; outline: none; margin-bottom: 15px; transition: 0.3s; }
    input:focus { border-color: var(--primary); }

    .btn-download { width: 100%; border: none; padding: 18px; border-radius: 16px; font-weight: 800; font-size: 1.1rem; cursor: pointer; color: white; background: linear-gradient(135deg, var(--primary), var(--secondary)); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
    
    .status { margin-top: 20px; padding: 15px; background: #334155; border-radius: 16px; font-size: 0.95rem; min-height: 60px; color: #cbd5e1; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    
    /* INTERSTITIAL OVERLAY */
    .ad-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center; }
    .close-x { position:absolute; top:20px; right:20px; background:#444; color:white; padding:10px 15px; border-radius:50%; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>
